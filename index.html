<!doctype html>
<html lang="ru" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Список задач: добавляйте, отмечайте, удаляйте — всё сохраняется в браузере." />
    <meta name="theme-color" content="#0c0d11" />
    <meta property="og:title" content="Список задач" />
    <meta property="og:description" content="To-Do List на React и TypeScript: два стиля, развёрнутый вид «Студия», сохранение в браузере." />
    <title>Список задач</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23a8e0a2'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%230e1a11' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Ставим стиль до первой отрисовки, чтобы не было вспышки другого цвета.
      // По умолчанию — «Ночь»; выбор пользователя запоминается в localStorage.
      try {
        var saved = localStorage.getItem('the-digital-todo:theme');
        document.documentElement.dataset.theme = saved === 'air' ? 'air' : 'night';
      } catch (e) {
        document.documentElement.dataset.theme = 'night';
      }
    </script>
    <style>
      /* Экран загрузки. Стили встроены сюда, чтобы он появился мгновенно, до загрузки скриптов */
      .splash {
        --splash-bg: #0c0d11;
        --splash-text: #f1f2f5;
        --splash-muted: #8a8f9c;
        --splash-accent: #a8e0a2;
        --splash-on-accent: #0e1a11;
        --splash-track: rgba(255, 255, 255, 0.08);
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family: 'Wix Madefor Display Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition:
          opacity 0.6s cubic-bezier(0.65, 0, 0.35, 1),
          visibility 0.6s;
      }
      [data-theme='air'] .splash {
        --splash-bg: #f3f5fa;
        --splash-text: #1a2138;
        --splash-muted: #7f89a3;
        --splash-accent: #4c7dff;
        --splash-on-accent: #ffffff;
        --splash-track: rgba(26, 33, 56, 0.08);
      }
      .splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition:
          transform 0.6s cubic-bezier(0.65, 0, 0.35, 1),
          filter 0.6s;
      }
      .splash__mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: var(--splash-accent);
        color: var(--splash-on-accent);
        animation: splash-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      /* Мягкое свечение, которое «дышит» за значком */
      .splash__mark::before {
        content: '';
        position: absolute;
        inset: -18px;
        z-index: -1;
        border-radius: 36px;
        background: var(--splash-accent);
        filter: blur(26px);
        opacity: 0.35;
        animation: splash-breathe 1.8s ease-in-out 0.5s infinite alternate;
      }
      .splash__check {
        stroke-dasharray: 26;
        stroke-dashoffset: 26;
        animation: splash-draw 0.45s cubic-bezier(0.65, 0, 0.35, 1) 0.4s forwards;
      }
      .splash__title {
        margin: 26px 0 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        animation: splash-rise 0.6s cubic-bezier(0.22, 0.8, 0.24, 1) 0.55s both;
      }
      .splash__note {
        margin: 6px 0 0;
        font-size: 14px;
        color: var(--splash-muted);
        animation: splash-rise 0.6s cubic-bezier(0.22, 0.8, 0.24, 1) 0.65s both;
      }
      .splash__bar {
        width: 140px;
        height: 3px;
        margin-top: 24px;
        border-radius: 3px;
        background: var(--splash-track);
        overflow: hidden;
        animation: splash-rise 0.6s cubic-bezier(0.22, 0.8, 0.24, 1) 0.75s both;
      }
      .splash__bar i {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--splash-accent);
        transform: scaleX(0);
        transform-origin: left;
        animation: splash-load 1.1s cubic-bezier(0.45, 0, 0.25, 1) 0.8s forwards;
      }
      .splash--out {
        opacity: 0;
        visibility: hidden;
      }
      .splash--out .splash__inner {
        transform: scale(1.06);
        filter: blur(6px);
      }
      @keyframes splash-pop {
        from {
          opacity: 0;
          transform: scale(0.5) rotate(-12deg);
        }
      }
      @keyframes splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @keyframes splash-load {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes splash-breathe {
        to {
          opacity: 0.6;
          transform: scale(1.12);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash *,
        .splash *::before {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" id="splash" role="status" aria-label="Загрузка">
      <div class="splash__inner">
        <div class="splash__mark">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              class="splash__check"
              d="M5 12.5l4.5 4.5L19 7.5"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <p class="splash__title">Список задач</p>
        <p class="splash__note">Готовим ваш день</p>
        <div class="splash__bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
